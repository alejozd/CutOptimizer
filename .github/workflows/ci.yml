name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests, build and browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx vite build

      # The unit suite cannot see layout or wiring defects: a broken class such as
      # `px-4hover:bg-amber-700` compiles, passes every test and still renders wrong.
      # This drives the built app in the Chrome that ships with the runner.
      - name: Browser smoke test
        run: node scripts/smoke.mjs
